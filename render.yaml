services:
  - type: web
    name: smartboard-api
    runtime: python
    plan: free
    rootDir: services/api
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn smartboard.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.12
      - key: AUTH_MODE
        value: token
      - key: APP_ACCESS_TOKEN
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: LLM_PROVIDER
        value: demo
