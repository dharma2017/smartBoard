services:
  - type: web
    name: smartboard-api
    runtime: python
    plan: free
    rootDir: services/api
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn smartboard.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.12
      - key: AUTH_MODE
        value: token
      - key: APP_ACCESS_TOKEN
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: LLM_PROVIDER
        value: demo
  - type: web
    name: smartboard-web
    runtime: node
    plan: free
    rootDir: apps/web
    buildCommand: npm ci && npm run build
    startCommand: node node_modules/next/dist/bin/next start --hostname 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: WEB_AUTH_USERNAME
        value: smartboard
      - key: WEB_AUTH_PASSWORD
        generateValue: true
